[package]
name = "flq-audio"
version = "1.0.0"
edition = "2024"
description = "FLQ: lossless audio format (framed, seekable, multi-track)"
license = "MIT"
repository = "https://github.com/nFeelon/flq-audio"
readme = "README.md"
rust-version = "1.85"
keywords = ["audio", "lossless", "codec", "flac", "compression"]
categories = [
    "multimedia::audio",
    "compression",
    "command-line-utilities",
    "encoding",
]
exclude = [
    "sample_pack/",
    "fuzz/",
    "wasm/",
    "web/",
    "testdata/",
    "state/",
    "docs/assets/",
]

[lib]
name = "flq"
path = "src/lib.rs"

[[bin]]
name = "flq"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
flacenc = { version = "=0.5.1", default-features = false }
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "isomp4", "alac"] }
